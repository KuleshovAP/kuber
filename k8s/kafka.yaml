apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: kafka-homework
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka-homework
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka-homework
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Иначе Service kafka создаёт KAFKA_PORT=tcp://..., конфликтующий
      # с устаревшей настройкой порта в Confluent entrypoint.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.9.0
          # broker.id должен быть числом: выделяем ordinal из имени Pod.
          command: ['/bin/bash', '-ec']
          args:
            - |
              export KAFKA_BROKER_ID="${HOSTNAME##*-}"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless.kafka-homework.svc.cluster.local:9092"
              exec /etc/confluent/docker/run
          env:
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: '3'
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: '3'
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: '2'
            - name: KAFKA_HEAP_OPTS
              value: '-Xms256m -Xmx256m'
          ports:
            - containerPort: 9092
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
